<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shawun Earn</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0a0a0a;color:#fff}
.h{background:linear-gradient(135deg,#00d2ff,#3a7bd5);padding:25px;border-radius:0 0 30px 30px;text-align:center}
.b{background:#1c1c1e;margin:15px;border-radius:20px;padding:20px;text-align:center;border:1px solid #333}
.b .a{font-size:40px;font-weight:900;color:#00ff88}
.btn{background:#00ff88;color:#000;border:none;padding:12px 30px;border-radius:30px;font-weight:800;margin-top:10px}
.t{background:#1c1c1e;margin:10px 15px;border-radius:15px;padding:16px;display:flex;justify-content:space-between;align-items:center;border:1px solid #2a2a2a}
.t button{background:#00ff88;border:none;padding:8px 18px;border-radius:20px;font-weight:700}
</style>
</head>
<body>
<div class="h"><h1>💰 Shawun Earn</h1><p>Watch Ads • Earn Money</p></div>
<div class="b"><p>YOUR BALANCE</p><div class="a" id="bal">$12.50</div><button class="btn">Withdraw</button></div>
<div class="t"><div>📺 Watch Ad +$0.10</div><button onclick="add(0.10)">Watch</button></div>
<div class="t"><div>👥 Invite +$1.00</div><button onclick="add(1)">Invite</button></div>
<div class="t"><div>✅ Daily +$0.50</div><button onclick="add(0.5)">Claim</button></div>
<script>let b=12.5;function add(v){b+=v;document.getElementById('bal').innerText='$'+b.toFixed(2);alert('+$'+v)}Telegram.WebApp.ready();Telegram.WebApp.expand();</script>
</body>
</html>
