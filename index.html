<!DOCTYPE html>
<html lang="bn">
<head><script src="https://quge5.com/88/tag.min.js" data-zone="298264" async data-cfasync="false"></script>
<meta charset="UTF-8">
<meta name="monetag" content="8cbd1ce89564601d64297d3af3e472c2">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHAWUN EARN - Earn Online</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6ff;color:#18233d}
header{background:linear-gradient(135deg,#102b70,#1768e8);color:white;padding:24px 18px 32px;border-radius:0 0 25px 25px}
.brand{font-size:25px;font-weight:900}
.brand span{color:#65f2c2}
header p{font-size:14px;color:#e0eaff}
.container{max-width:520px;margin:auto;padding:16px}
.balance{background:white;border-radius:18px;padding:20px;margin-top:-10px;box-shadow:0 5px 20px #102b7010}
.small{font-size:13px;color:#64718b}
.amount{font-size:32px;font-weight:bold;color:#145ce0;margin:10px 0}
button{border:0;border-radius:11px;padding:13px;font-weight:bold;font-size:15px;cursor:pointer}
.primary{background:#1768e8;color:white;width:100%}
h3{font-size:18px;margin:23px 0 12px}
.task{background:white;border-radius:15px;padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;box-shadow:0 3px 12px #102b7008}
.emoji{background:#eaf1ff;border-radius:12px;padding:13px;font-size:24px}
.taskinfo{flex:1}
.taskinfo b{font-size:15px}
.taskinfo p{margin:6px 0 0;font-size:12px;color:#64718b}
.task button{background:#e7efff;color:#145ce0;padding:10px}
nav{position:sticky;bottom:0;background:white;display:flex;justify-content:space-around;padding:14px 5px;border-top:1px solid #e8ecf5;margin-top:20px}
nav a{text-decoration:none;color:#52627e;font-size:12px;text-align:center}
</style>
</head>
<body>

<header>
  <div class="brand">SHAWUN <span>EARN</span></div>
  <p>ছোট ছোট অনলাইন টাস্ক করে আয় করুন</p>
</header>

<main class="container">
  <section class="balance" id="balance-box">
    <div class="small">আপনার ব্যালেন্স</div>
    <div class="amount">৳ <span id="balance">0.00</span></div>
    <button class="primary" onclick="openWithdraw()">টাকা তুলুন</button>
  </section>

  <h3>🚀 Earn করার টাস্ক</h3>

  <div class="task">
    <div class="emoji">📺</div>
    <div class="taskinfo">
      <b>Watch Ads</b>
      <p>১টি বিজ্ঞাপন দেখে ৳0.50 আয় করুন</p>
    </div>
    <button onclick="watchAd()">দেখুন</button>
  </div>

  <div class="task">
    <div class="emoji">🎁</div>
    <div class="taskinfo">
      <b>Daily Bonus</b>
      <p>প্রতিদিন ৳1.00 ফ্রি বোনাস</p>
    </div>
    <button onclick="dailyBonus()">নিন</button>
  </div>
</main>

<div id="withdrawModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000000bb;z-index:999;">
  <div style="background:white;max-width:400px;margin:60px auto;padding:20px;border-radius:15px;">
    <h3 style="margin-top:0;">💸 টাকা তুলুন</h3>
    <label>পদ্ধতি:</label>
    <select id="wmethod" style="width:100%;padding:10px;margin:5px 0 10px;">
      <option>bKash</option><option>Nagad</option><option>Rocket</option>
    </select>
    <label>নম্বর:</label>
    <input id="wnumber" style="width:100%;padding:10px;margin:5px 0 10px;" placeholder="01XXXXXXXXX">
    <label>পরিমাণ (সর্বনিম্ন ৳100):</label>
    <input id="wamount" type="number" style="width:100%;padding:10px;margin:5px 0 10px;">
    <button onclick="submitWithdraw()" style="background:#1768e8;color:white;padding:12px;width:100%;border:0;border-radius:8px;">Submit</button>
    <button onclick="closeWithdraw()" style="background:#ddd;padding:12px;width:100%;margin-top:8px;border:0;border-radius:8px;">বন্ধ করুন</button>
  </div>
</div>

<section style="max-width:420px;margin:20px auto;padding:20px;background:#151b2e;color:white;border-radius:16px;">
  <h2 style="text-align:center;">🔐 আমার অ্যাকাউন্ট</h2>
  <input id="account-email" type="email" placeholder="ইমেইল" style="width:100%;padding:12px;margin:5px 0;box-sizing:border-box;border:0;border-radius:8px;">
  <input id="account-password" type="password" placeholder="পাসওয়ার্ড (৬+ অক্ষর)" style="width:100%;padding:12px;margin:5px 0;box-sizing:border-box;border:0;border-radius:8px;">
  <button id="create-account" style="width:100%;padding:12px;margin:5px 0;background:#16a34a;color:white;border:0;border-radius:8px;">Create Account</button>
  <button id="login-account" style="width:100%;padding:12px;margin:5px 0;background:#2563eb;color:white;border:0;border-radius:8px;">Login</button>
  <button id="logout-account" style="width:100%;padding:12px;margin:5px 0;background:#dc2626;color:white;border:0;border-radius:8px;">Logout</button>
  <div id="my-account" style="margin-top:12px;overflow-wrap:anywhere;">তুমি লগইন করোনি।</div>
  <p id="account-message" style="color:#fbbf24;overflow-wrap:anywhere;"></p>
</section>

<nav>
  <a href="#">🏠<br>Home</a>
  <a href="#balance-box">💰<br>Balance</a>
</nav>

<footer style="text-align:center;font-size:12px;color:#7a8498;padding:15px">© 2026 SHAWUN EARN</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, addDoc, collection, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCPWmCQ-7jaOE1ve18PHPeuwXENYbrNVj0",
  authDomain: "shawun-earn.firebaseapp.com",
  projectId: "shawun-earn",
  storageBucket: "shawun-earn.firebasestorage.app",
  messagingSenderId: "194329407831",
  appId: "1:194329407831:web:1b53667a1eb8d7b5980e12"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const ZONE = "296059";
const AD_SRC = "https://quge5.com/88/tag.min.js";

let balance = 0;
const balanceEl = document.getElementById("balance");
const msg = document.getElementById("account-message");
const info = document.getElementById("my-account");

function setBalance(v){ balance = Number(v); balanceEl.textContent = balance.toFixed(2); }

onAuthStateChanged(auth, async (user) => {
  if (user) {
    info.textContent = "✅ লগইন: " + user.email;
    try {
      const ref = doc(db, "users", user.uid);
      const snap = await getDoc(ref);
      if (snap.exists()) setBalance(snap.data().balance || 0);
      else { await setDoc(ref, { email: user.email, balance: 0, createdAt: serverTimestamp() }); setBalance(0); }
    } catch(e){ console.log(e); }
  } else {
    info.textContent = "তুমি লগইন করোনি।";
    setBalance(0);
  }
});

document.getElementById("create-account").onclick = async () => {
  const email = document.getElementById("account-email").value.trim();
  const pass = document.getElementById("account-password").value;
  if (!email || pass.length < 6) return msg.textContent = "সঠিক ইমেইল ও ৬+ অক্ষরের পাসওয়ার্ড দাও।";
  try { await createUserWithEmailAndPassword(auth, email, pass); msg.textContent = "✅ অ্যাকাউন্ট তৈরি হয়েছে!"; }
  catch (e) { msg.textContent = "❌ " + e.message; }
};

document.getElementById("login-account").onclick = async () => {
  const email = document.getElementById("account-email").value.trim();
  const pass = document.getElementById("account-password").value;
  try { await signInWithEmailAndPassword(auth, email, pass); msg.textContent = "✅ লগইন সফল!"; }
  catch (e) { msg.textContent = "❌ ভুল ইমেইল বা পাসওয়ার্ড"; }
};

document.getElementById("logout-account").onclick = async () => { await signOut(auth); msg.textContent = "লগআউট হয়েছে।"; };

async function addMoney(amount) {
  const user = auth.currentUser;
  await updateDoc(doc(db, "users", user.uid), { balance: increment(amount) });
  setBalance(balance + amount);
}

function loadMonetag() {
  return new Promise((resolve, reject) => {
    if (typeof window["show_" + ZONE] === "function") return resolve();
    const s = document.createElement("script");
    s.src = AD_SRC;
    s.setAttribute("data-zone", ZONE);
    s.setAttribute("data-sdk", "show_" + ZONE);
    s.setAttribute("data-cfasync", "false");
    s.async = true;
    s.onload = () => setTimeout(resolve, 800);
    s.onerror = () => reject(new Error("script"));
    document.head.appendChild(s);
  });
}

window.watchAd = async () => {
  if (!auth.currentUser) return alert("আগে নিচের কালো বক্স থেকে Login করুন!");
  alert("Ad আসছে... পুরোটা দেখে Close করো! (প্রথমবার ৫-১০ সেকেন্ড লাগতে পারে)");
  try {
    await loadMonetag();
    const show = window["show_" + ZONE];
    if (typeof show !== "function") throw new Error("no-sdk");
    await show();
    await addMoney(0.50);
    alert("🎉 ৳0.50 ব্যালেন্সে যোগ হয়েছে!");
  } catch (e) {
    alert("❌ Ad লোড হয়নি।\n\nMonetag → Zones → Zone " + ZONE + " এর Format 'Interstitial' বা 'Rewarded Interstitial' কিনা চেক করো।");
  }
};

window.dailyBonus = async () => {
  if (!auth.currentUser) return alert("আগে Login করুন!");
  const ref = doc(db, "users", auth.currentUser.uid);
  const snap = await getDoc(ref);
  const today = new Date().toDateString();
  if (snap.exists() && snap.data().lastBonus === today) return alert("আজকের বোনাস নেওয়া হয়ে গেছে! কাল আবার আসো।");
  await updateDoc(ref, { lastBonus: today });
  await addMoney(1.00);
  alert("🎁 ৳1.00 ডেইলি বোনাস পেয়েছেন!");
};

window.openWithdraw = () => {
  if (!auth.currentUser) return alert("আগে Login করুন!");
  document.getElementById("withdrawModal").style.display = "block";
};
window.closeWithdraw = () => document.getElementById("withdrawModal").style.display = "none";

window.submitWithdraw = async () => {
  const user = auth.currentUser;
  const method = document.getElementById("wmethod").value;
  const number = document.getElementById("wnumber").value.trim();
  const amount = parseFloat(document.getElementById("wamount").value);
  if (number.length !== 11) return alert("সঠিক ১১ ডিজিটের নম্বর দিন");
  if (!amount || amount < 100) return alert("সর্বনিম্ন ৳100 তুলতে হবে");
  if (amount > balance) return alert("পর্যাপ্ত ব্যালেন্স নেই");
  try {
    await addDoc(collection(db, "withdrawals"), { uid: user.uid, email: user.email, method, number, amount, status: "pending", createdAt: serverTimestamp() });
    await updateDoc(doc(db, "users", user.uid), { balance: increment(-amount) });
    setBalance(balance - amount);
    alert("✅ Withdraw Request পাঠানো হয়েছে!");
    closeWithdraw();
  } catch (e) { alert("সমস্যা: " + e.message); }
};
</script>

</body>
</html>
